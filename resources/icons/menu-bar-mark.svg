<!--
  The menu bar mark (docs/DESIGN.md, "App icon and menu bar mark"): a solid stamp, tilted -8 degrees,
  with the check cut out. Black on transparent: macOS tints a template image for light and dark menu bars.
  Render: rsvg-convert -w 15 -h 15 resources/icons/menu-bar-mark.svg -o public/menuBarIconTemplate.png
          rsvg-convert -w 30 -h 30 resources/icons/menu-bar-mark.svg -o public/menuBarIconTemplate@2x.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <mask id="cut">
    <rect width="18" height="18" fill="#fff"/>
    <g transform="rotate(-8 9 9)">
      <path d="M5.8 9.1 7.9 11.1 12.2 6.9" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </mask>
  <g mask="url(#cut)">
    <g transform="rotate(-8 9 9)">
      <rect x="1.8" y="4.3" width="14.4" height="9.4" rx="1.8" fill="#000"/>
    </g>
  </g>
</svg>
