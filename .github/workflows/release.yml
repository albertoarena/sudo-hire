# Builds the macOS app for Apple silicon (arm64). There is no Intel build.
# A tag v* builds, signs and notarises, checks the result, and uploads it to a draft release.
# A human tests the draft and publishes it. This workflow never publishes a release.
# workflow_dispatch builds an unsigned test app and keeps the DMG as a workflow artifact only.
# See docs/DECISIONS.md, "The release flow".

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  test:
    name: Tests and the CA bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, dom, libxml, mbstring
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (page tests need the Vite manifest)
        run: npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: vendor/bin/pest

      - name: Vitest
        run: npm test

      - name: The CA bundle is not older than 180 days
        run: php artisan release:check-cacert

  build:
    name: Build for arm64
    needs: test
    # A fixed image, so a new macos-latest cannot change a release without a commit.
    runs-on: macos-15
    timeout-minutes: 90
    # The signing values live in the environment "release", which waits for the maintainer's approval.
    # A manual run uses no environment, so it has no signing values and builds unsigned.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build bundles the PHP that runs it. Sudo Hire ships PHP 8.4.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, dom, libxml, mbstring
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Refuse an old PHP
        run: php -r 'if (PHP_VERSION_ID < 80400) { fwrite(STDERR, "The build needs PHP 8.4, not ".PHP_VERSION.PHP_EOL); exit(1); }'

      - name: Set the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="$(node scripts/release-version.mjs "$GITHUB_REF_NAME")"
          else
            version="0.0.0-test.${GITHUB_RUN_NUMBER}"
          fi
          echo "NATIVEPHP_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check the signing and notarisation values
        if: github.event_name == 'push'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the environment \"release\"."
              missing=1
            fi
          done
          exit "$missing"

      # notarytool reads the App Store Connect API key from a file. Only the owner can read it.
      - name: Write the notarisation key
        if: github.event_name == 'push'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key")
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # A keychain that lives only for this job, with the Developer ID certificate. The build and the DMG step sign from it.
      # electron-builder 26.8.1 can import CSC_LINK itself, but it gives the .p12 password where the keychain password goes, and macOS refuses it.
      - name: Import the signing certificate
        if: github.event_name == 'push'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          (umask 077 && printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(sed -e 's/^ *"//' -e 's/"$//' <<< "$line")"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::CSC_LINK has no Developer ID Application certificate."
            exit 1
          fi
          echo "Signing as: Developer ID Application: $identity"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"

      # electron-builder signs the app from that keychain (CSC_KEYCHAIN, CSC_NAME), notarises it with the API key and staples it,
      # before it makes the zip and the DMG. NativePHP's own notarisation needs an Apple ID, so it skips.
      - name: Build, sign and notarise
        if: github.event_name == 'push'
        env:
          NATIVEPHP_UPDATER_ENABLED: 'true'
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: php artisan native:build mac arm64 --no-interaction

      - name: Build unsigned
        if: github.event_name != 'push'
        env:
          NATIVEPHP_UPDATER_ENABLED: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: php artisan native:build mac arm64 --no-interaction

      # native:build exits 0 even when electron-builder fails, so check that the files are there.
      - name: List the build
        run: |
          ls -la nativephp/electron/dist
          for pattern in '*.dmg' '*.zip' 'latest-mac.yml'; do
            if ! compgen -G "nativephp/electron/dist/$pattern" > /dev/null; then
              echo "::error::The build made no $pattern. See the log of the build step."
              exit 1
            fi
          done

      # electron-builder does not sign the DMG. Sign it with the same certificate, notarise it and staple it,
      # so the first open works with no network. The DMG blockmap no longer matches, and the updater uses only the zip.
      - name: Sign, notarise and staple the DMG
        if: github.event_name == 'push'
        env:
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for dmg in nativephp/electron/dist/*.dmg; do
            echo "Signing $dmg"
            codesign --force --timestamp --sign "Developer ID Application: $CSC_NAME" --keychain "$CSC_KEYCHAIN" "$dmg"
            result="$(xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json)" || true
            echo "$result"
            if [ "$(jq -r .status <<< "$result" 2> /dev/null)" != "Accepted" ]; then
              xcrun notarytool log "$(jq -r .id <<< "$result")" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              echo "::error::Apple did not accept $dmg."
              exit 1
            fi
            scripts/retry.sh 5 xcrun stapler staple "$dmg"
            rm -f "$dmg.blockmap"
          done

      # NativePHP logs a notarisation error and goes on, so these checks are the gate.
      - name: Check the signature, Gatekeeper and the notarisation ticket
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for dmg in nativephp/electron/dist/*.dmg; do
            echo "Checking $dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
            scripts/retry.sh 5 xcrun stapler validate "$dmg"
            mount="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" > /dev/null
            app="$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vv "$app"
            scripts/retry.sh 5 xcrun stapler validate "$app"
            hdiutil detach "$mount" > /dev/null
          done

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sudo-hire-mac
          if-no-files-found: error
          path: |
            nativephp/electron/dist/*.dmg
            nativephp/electron/dist/*.zip
            nativephp/electron/dist/*.blockmap
            nativephp/electron/dist/latest-mac.yml

  draft:
    name: Upload to a draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sudo-hire-mac
          path: dist

      # latest-mac.yml names the files with a dash for each space ("Sudo-Hire-1.0.0-arm64.zip").
      # GitHub would turn a space into a dot, and the updater would not find the file.
      # The updater reads only the zip, so the DMG gets the download name "sudo-hire-1.0.0-arm64.dmg".
      - name: Name the files as latest-mac.yml does, and name the DMG for download
        run: |
          for file in dist/*' '*; do
            [ -e "$file" ] || continue
            mv "$file" "${file// /-}"
          done
          for file in dist/Sudo-Hire-*.dmg dist/Sudo-Hire-*.dmg.blockmap; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            mv "$file" "dist/sudo-hire-${name#Sudo-Hire-}"
          done
          ls -la dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a dash, for example v1.0.0-rc.1, is a release candidate: a pre-release.
        # The maintainer writes the release notes before publishing.
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            "${prerelease[@]}" \
            --verify-tag \
            --title "Sudo Hire ${GITHUB_REF_NAME#v}" \
            --notes "Draft. Install and test the DMG, and write the release notes, before you publish this release."
