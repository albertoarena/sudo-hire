name: Strip attribution

# Cloud sessions get a "Generated by Claude Code" footer in the pull request
# body from the platform. AGENTS.md hard rule 6 forbids it, so remove it.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  strip:
    name: Remove the attribution footer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - uses: actions/github-script@v8
        with:
          script: |
            const { stripAttribution } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/strip-attribution.mjs`);
            const pr = context.payload.pull_request;
            const body = pr.body ?? '';
            const cleaned = stripAttribution(body);

            // Edit only when the body changes, so the "edited" event does not loop.
            if (cleaned === body) {
              core.info('No attribution footer.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: cleaned,
            });
            core.info('Attribution footer removed.');
