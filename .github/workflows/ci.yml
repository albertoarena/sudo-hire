name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  php:
    name: Pest and PHPStan (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, dom, libxml, mbstring
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (page tests need the Vite manifest)
        run: npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: vendor/bin/pest

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  frontend:
    name: Vitest and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test
